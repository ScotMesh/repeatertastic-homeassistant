# SonarQube, run on demand (not in CI):
#
#   go test ./... -coverprofile=coverage.out
#   docker run --rm --network host -v "$PWD:/usr/src" \
#     -e SONAR_HOST_URL=http://localhost:9000 -e SONAR_TOKEN=... sonarsource/sonar-scanner-cli
sonar.projectKey=repeatertastic-homeassistant
sonar.projectName=RepeaterTastic for Home Assistant
sonar.sourceEncoding=UTF-8
sonar.sources=cmd,internal
sonar.tests=internal
sonar.test.inclusions=**/*_test.go
sonar.exclusions=**/*_test.go
sonar.go.coverage.reportPaths=coverage.out
