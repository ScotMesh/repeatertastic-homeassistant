<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="RepeaterTastic for Home Assistant">
  <title>RepeaterTastic for Home Assistant</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b3a5c"/>
      <stop offset="1" stop-color="#0d1c2e"/>
    </linearGradient>
  </defs>

  <rect width="256" height="256" rx="56" fill="url(#sky)"/>

  <!-- The roof: a house, because the readings end up in someone's home. -->
  <path d="M128 54 L214 132 h-26 v62 a10 10 0 0 1-10 10 h-100 a10 10 0 0 1-10-10 v-62 H42 Z"
        fill="none" stroke="#e8eef5" stroke-width="12" stroke-linejoin="round"/>

  <!-- The mast inside it, and the three arcs of a signal leaving. -->
  <line x1="128" y1="196" x2="128" y2="140" stroke="#e8eef5" stroke-width="10" stroke-linecap="round"/>
  <circle cx="128" cy="130" r="9" fill="#5ec8a0"/>
  <path d="M104 118 a32 32 0 0 1 48 0" fill="none" stroke="#5ec8a0" stroke-width="8" stroke-linecap="round" opacity="0.9"/>
  <path d="M88 104 a54 54 0 0 1 80 0" fill="none" stroke="#5ec8a0" stroke-width="8" stroke-linecap="round" opacity="0.6"/>
</svg>
