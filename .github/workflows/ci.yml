name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Format
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: Lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.13
      - name: Vet and test
        run: make test
      - name: Bundle
        run: ./scripts/bundle.sh ci-${GITHUB_SHA::7} dist/repeatertastic-homeassistant.zip
      - uses: actions/upload-artifact@v4
        with:
          name: repeatertastic-homeassistant-bundle
          path: dist/repeatertastic-homeassistant.zip
